[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tianling"
version = "0.1.0"
description = "Tianling — Blue Heaven Sect's player registry and LFG matchmaking bot."
readme = "docs/SPEC.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "discord.py>=2.4,<3",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "greenlet>=3",
    "PyYAML>=6",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["tianling*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
